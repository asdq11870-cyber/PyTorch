StableDiffusion:

  CLIP:
    embed_dim: 768
    heads: 12
    vocab_size: 49408
    max_seq_len: 77
    mlp_expansion: 4
    num_encoder_layers: 12

  UNET:
    embed_dim: 768
    heads: 12
    upsample_scale_factor: 2

  VAE:
    num_groups: 32
    latent_channels: 4
    rgb_channels: &anchor 3
    encoder_input_channels: 128
    encoder_output_channels: 8
    decoder_input_channels: 512
    decoder_output_channels: *anchor
    upsample_scale_factor: 2

    